name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The org's reusable Node pipeline (krizaka/.github node-ci.yml) for the app's web UI: types, unit tests and the Vite build.
# The Rust side (fmt, clippy, tests) and the .dmg are the desktop pipeline's (desktop.yml, tauri-macos.yml).
jobs:
  ci:
    permissions:
      contents: read
    uses: krizaka/.github/.github/workflows/node-ci.yml@bd1c2fb5d8c5dba238ab287767d1c28af48ca569 # main
    with:
      package-manager: pnpm
      lint-script: lint
      typecheck-script: typecheck
      test-script: test
      build-script: "build:ui"
